name: Stock check

on:
  # SCHEDULE DISABLED 2026-08-15 - the checker now runs persistently on the
  # operator's Windows machine (scripts/run-checker.cmd, launched from the
  # Startup folder), which is what makes the alerts realtime.
  #
  # Two reasons not to run both: every alert would be sent TWICE to
  # subscribers, since each runner keeps its own state file and neither can
  # see the other's transitions. And GitHub's scheduler was never fit for this
  # anyway - measured over 12 consecutive runs it fired every ~27 min on
  # average (39 min worst) despite asking for 10, because scheduled workflows
  # are best-effort on shared runners.
  #
  # Kept as workflow_dispatch so it can still be triggered by hand as a
  # fallback if the local machine is down for a while.
  #
  #   schedule:
  #     - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Prevent overlapping runs (e.g. a slow check still running when the next
# cron tick fires) from racing on the cached state file.
concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Headroom over the real cycle cost, NOT a target to run up to. At 10
    # minutes every scheduled run was cancelled part-way through "Run one
    # check cycle", so whichever targets sat late in the cycle were never
    # checked and could never alert. The cold sweep is the long pole (full
    # page renders, most of them Zepto's scripted location-picker waits); it
    # now runs at COLD_CONCURRENCY, which brings a cycle well under this.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Restore last-known stock state
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: |
            stock-state-

      - name: Run one check cycle
        env:
          RUN_ONCE: "true"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start

      - name: Save last-known stock state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: stock-state-${{ github.run_id }}

      # Only ever populated when a DOM check throws (e.g. a pre-action
      # selector never appears) - lets us see whether a failing target got a
      # changed page, a CAPTCHA/blocked page, or something else, without
      # needing a live browser on hand.
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-${{ github.run_id }}
          path: data/debug/
          if-no-files-found: ignore
          retention-days: 3
